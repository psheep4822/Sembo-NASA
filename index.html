<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas Mission - SEMBO</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <img src="marcaDagua.png" alt="Sembo Logo" id="marcaDagua">

    <div id="telaMenu" class="tela-menu">
        <h1 class="faixaFundo">Atlas Mission</h1>
        <div class="fullwidth">
            <a href="presentationSembo.html">
                <img src="botoes/aboutUs.png" id="aboutUsButton" class="imgButton">
            </a>
        </div>
        <div class="fullwidth">
            <img src="botoes/start.png" id="startButton" class="imgButton" onclick="startGame()">
        </div>
        <div class="fullwidth">
            <a href="presentationGame.html">
                <img src="botoes/aboutGame.png" id="aboutGameButton" class="imgButton">
            </a>
        </div>
    </div>

    <div id="telaJogo" class="escondido">
        <div id="overlay"></div>
        <p id="diasPassados" class="texts">Current Day: 0</p>
        <div class="fullwidth">
            <img id="btnPassagemDias" class="escondido imgButton" src="botoes/newDay.png" onclick="passagemDias()">
        </div>
        <p id="bateriaNave" class="texts">Spaceship Energy: 100</p>
        <p id="oxigenNave" class="texts">Spaceship Oxygen: 100</p>
        <p id="pesquisaNave" class="texts">Reseach Points: 0</p>
        <p id="saudeTripulacao" class="texts">Crew Health: 100</p>

        <img src="blocoNotas.png" alt="Mission Post-it Block" id="bloco" onclick="missoes()">

        <img src="botoes/exit.png" id="sair" onclick="sair()">
    </div>

    <div id="telaMissoes" class="escondido">
        <h1>Mission</h1>
        <p id="missoes">Choose a mission to do:</p>
        <button id="missao1" class="botaoMissao" onclick="abrirMissaoFixa(0)">Mission 1</button>
        <button id="missao2" class="botaoMissao" onclick="abrirMissaoFixa(1)">Mission 2</button>
        <p id="missaoSorteada"></p>
        <div id="sortear" class="escondido">
            <button id="btnSortear" class="sortear" onclick="sortearMissao()">Do the daily random mission</button>
        </div>

        <div id="detalheMissao"></div>

        <div id="botoesDecisao" class="escondido">
            <button class="adicionar" onclick="escolherSorteada('A')">Choose A</button>
            <button class="adicionar" onclick="escolherSorteada('B')">Choose B</button>
        </div>

        <button class="subtrair" onclick="voltar()">Go back</button>
    </div>

    <div id="telaPerdeu" class="escondido">
        <h1>Game Over</h1>
        <p id="resultadoP">The astronauts couldn't complete the mission</p>
        <button class="sair" onclick="recomecar()">Play Again</button>
    </div>

    <div id="telaVenceu" class="escondido">
        <h1>You Won!</h1>
        <p id="resultadoV">Congratulations! You survived all the 10 days!</p>
        <button class="sair" onclick="recomecar()">Play Again</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
